name: go-test-app
on:
  push:
    branches: [main]

jobs:
  verify:
    image: golang:1.26-alpine
    # The job machine pulls its image itself, which needs the network.
    network:
      enabled: true
    steps:
      - name: build
        run: go build ./...
      - name: checks
        parallel:
          - name: unit tests
            run: go test -v ./...
          - name: vet
            run: go vet ./...
      - name: summary
        run: echo "all checks passed on $(go version)"
